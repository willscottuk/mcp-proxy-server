<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Web Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
</head>
<body class="terminal-page">
    <div class="terminal-header navbar border-b border-slate-700 bg-slate-900 px-4">
        <div class="navbar-start">
            <span class="font-semibold text-slate-100">Web Terminal</span>
        </div>
        <div class="navbar-center">
            <span id="terminal-status" class="terminal-status disconnected badge badge-outline">Disconnected</span>
        </div>
        <div class="navbar-end">
            <a href="/admin/index.html" class="back-link btn btn-ghost btn-sm text-slate-200">Back to Admin</a>
        </div>
    </div>
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="terminal.js"></script> <!-- Link to our terminal logic -->
</body>
</html>
